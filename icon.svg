<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;display=swap');
    text{font-family:'Archivo Black','Arial Black',sans-serif}
  </style>
  <defs>
    <filter id="scratch" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="6" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#FF5A1F"/>
  <text x="256" y="384" text-anchor="middle" font-size="450" fill="#000" filter="url(#scratch)">M</text>
</svg>
